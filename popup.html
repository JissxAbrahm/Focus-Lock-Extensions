<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Lock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark">🔒</div>
      <div>
        <h1>Focus Lock</h1>
        <p id="status">Checking status…</p>
      </div>
    </header>
    <button id="toggle" type="button">Lock this tab</button>
    <p class="hint" id="hint">Choose the tab you want to focus on, then lock it.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
